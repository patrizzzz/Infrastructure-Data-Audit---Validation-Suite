# Philippine Infrastructure (DPWH) Data Quality Validation Rules Configuration

dataset_info:
  name: "DPWH Road and Bridge Inventory"
  country: "Philippines"
  version: "2021/2022"

spatial_bounds:
  latitude:
    min: 4.5
    max: 21.5
  longitude:
    min: 116.0
    max: 127.0

mandatory_columns:
  - "BRIDGE_ID"
  - "BR_NAME"
  - "REGION"
  - "PROVINCE"
  - "DEO"
  - "ROAD_NAME"

numerical_bounds:
  BR_LENGTH:
    min: 0.1
    max: 5000.0
    unit: "meters"
    description: "Bridge physical length in meters"
  BR_WIDTH:
    min: 1.0
    max: 60.0
    unit: "meters"
    description: "Bridge carriageway width in meters"
  NUM_SPAN:
    min: 1
    max: 150
    description: "Total number of bridge spans"
  NUM_LANES:
    min: 1
    max: 16
    description: "Total number of traffic lanes"
  LOAD_LIMIT:
    min: 0
    max: 100
    unit: "tons"
    description: "Maximum allowable vehicle weight limit"

date_bounds:
  construction_year:
    min: 1800
    max: 2026
    description: "Actual or recorded year of bridge construction"

regex_patterns:
  BRIDGE_ID: "^B\\d{5}[A-Z]{2}$"
  SEC_ID: "^S\\d{5}[A-Z]{2}$"

allowed_categories:
  CONDITION:
    - "Good"
    - "Fair"
    - "Poor"
    - "Bad"
  BR_TYPE1:
    - "Concrete"
    - "Steel"
    - "Timber"
    - "Masonry"
    - "Pre-stressed Concrete"
    - "Other"
  BR_TYPE2:
    - "Permanent"
    - "Temporary"

quality_score_weights:
  completeness: 0.25
  validity: 0.30
  uniqueness: 0.20
  consistency: 0.15
  timeliness: 0.10

score_grading_scale:
  A: 90.0
  B: 80.0
  C: 70.0
  D: 60.0
  F: 0.0
